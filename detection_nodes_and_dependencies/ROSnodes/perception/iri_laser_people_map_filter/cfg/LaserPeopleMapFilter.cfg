# Author: 

PACKAGE='iri_laser_people_map_filter'

from dynamic_reconfigure.parameter_generator_catkin import *

gen = ParameterGenerator()

#       Name                       Type       Reconfiguration level            Description                       Default   Min   Max
#gen.add("velocity_scale_factor",  double_t,  0,                               "Maximum velocity scale factor",  0.5,      0.0,  1.0)
gen.add("filter",     bool_t,  0, "enable/disable map filtering",  True)
gen.add("neighborRadius",     double_t,  0, "Threshold distance in meters where to filter people detections ",  0.25,      0.0,  3.0)

gen.add("markerWidth",        double_t,  0, "Dimension of detected people markers",     0.7,      0.0,  1.0)
gen.add("markerHeight",       double_t,  0, "Dimension of detected people markers",     1.0,      0.0,  2.0)
gen.add("markerR",            double_t,  0, "marker R color component",                 1.0,      0.0,  1.0)
gen.add("markerG",            double_t,  0, "marker G color component",                 0.0,      0.0,  1.0)
gen.add("markerB",            double_t,  0, "marker B color component",                 0.0,      0.0,  1.0)
gen.add("markerA",            double_t,  0, "marker ALPHA color component",             0.75,     0.0,  1.0)

exit(gen.generate(PACKAGE, "LaserPeopleMapFilterAlgorithm", "LaserPeopleMapFilter"))
